name: Photo Studio - Dual Orientation Smart Crop

on:
  push:
    paths:
      - '.github/workflows/smart-crop-orientations.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  crop-upgrade:
    name: Upgrade and test separate portrait landscape cropping
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download current application
        uses: actions/checkout@v4

      - name: Add dual-orientation crop and live previews
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          html_file = Path('PhotoStudio/web/index.html')
          app_file = Path('PhotoStudio/app.py')
          runtime_file = Path('PhotoStudio/web/runtime.js')
          html = html_file.read_text(encoding='utf-8')
          app = app_file.read_text(encoding='utf-8')
          runtime = runtime_file.read_text(encoding='utf-8')

          styles = r"""
          <style id="ps-dual-crop-style">
          #psCropOrientationTabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
          #psCropOrientationTabs button{flex:1;min-width:120px}
          .ps-crop-orient-label{font-size:12px;color:var(--muted);margin:0 0 7px}
          .ps-crop-preview-panel{border:1px solid var(--line);border-radius:14px;
            background:#0b1729;padding:14px;margin:16px 0;animation:ps-output-enter .35s ease both}
          .ps-crop-preview-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
          .ps-crop-preview-card{min-width:0;border:1px solid var(--line2);
            border-radius:12px;background:#0a1425;padding:11px}
          .ps-crop-preview-card b{font-size:12px;display:block;margin-bottom:8px}
          .ps-crop-preview-card canvas{width:100%;height:140px;object-fit:contain;
            background:#050a15;border-radius:9px}
          .ps-crop-preview-card small{display:block;color:var(--muted);
            font-size:11px;margin-top:8px;line-height:1.45}
          .ps-crop-preview-card.is-active{border-color:var(--c1);
            box-shadow:0 0 18px color-mix(in srgb,var(--c1),transparent 85%)}
          @media(max-width:520px){.ps-crop-preview-pair{grid-template-columns:1fr}}
          </style>
          """
          html = one(html, '</head>', styles + '</head>', 'Crop styles')

          anchor = "  const cropFree=$('#cropFree');"
          addition = r"""
          const cropStates={
            landscape:{rect:{x:0,y:0,w:1,h:1},ratio:'free'},
            portrait:{rect:{x:0,y:0,w:1,h:1},ratio:'free'}
          };
          let cropOrientation='landscape';
          let cropSamples={landscape:null,portrait:null};
          let cropScanVersion=0;
          let cropPreviewFrame=0;

          const cropSettings=$('#cropRatios').closest('.setting');
          const orientControl=document.createElement('div');
          orientControl.className='setting';
          orientControl.innerHTML=
            '<div class="ps-crop-orient-label"><b>Настройка рамки отдельно для каждого типа фото</b></div>'+
            '<div class="ratio-tabs" id="psCropOrientationTabs" role="group" aria-label="Тип изображения">'+
            '<button type="button" class="active" data-orient="landscape">Горизонтальные</button>'+
            '<button type="button" data-orient="portrait">Вертикальные</button></div>';
          cropSettings.insertAdjacentElement('beforebegin',orientControl);

          const cropPreviewPanel=document.createElement('section');
          cropPreviewPanel.className='ps-crop-preview-panel';
          cropPreviewPanel.id='psCropPreviewPanel';
          cropPreviewPanel.setAttribute('aria-label','Предпросмотр результата обрезки');
          cropPreviewPanel.innerHTML=
            '<div class="panel-title">Предпросмотр перед сохранением</div>'+
            '<p class="panel-desc">Каждая ориентация использует собственную рамку. '+
            'Здесь показан пример итогового кадра.</p>'+
            '<div class="ps-crop-preview-pair">'+
            '<div class="ps-crop-preview-card is-active" data-preview-orient="landscape">'+
            '<b>Горизонтальные</b><canvas id="psCropPreviewLandscape"></canvas>'+
            '<small id="psCropStatusLandscape">Добавь горизонтальные фото</small></div>'+
            '<div class="ps-crop-preview-card" data-preview-orient="portrait">'+
            '<b>Вертикальные</b><canvas id="psCropPreviewPortrait"></canvas>'+
            '<small id="psCropStatusPortrait">Добавь вертикальные фото</small></div></div>';
          cropSettings.insertAdjacentElement('afterend',cropPreviewPanel);

          function publishCropStates(){
            cropStates[cropOrientation].rect={...selection};
            cropStates[cropOrientation].ratio=cropRatio;
            window.PhotoStudioCropRects={
              landscape:{...cropStates.landscape.rect},
              portrait:{...cropStates.portrait.rect}
            };
            window.PhotoStudioCropRatios={
              landscape:cropStates.landscape.ratio,
              portrait:cropStates.portrait.ratio
            };
          }

          function drawCropPreview(kind){
            const sample=cropSamples[kind];
            const canvas=$('#psCropPreview'+(kind==='portrait'?'Portrait':'Landscape'));
            const status=$('#psCropStatus'+(kind==='portrait'?'Portrait':'Landscape'));
            if(!sample || !sample.image.naturalWidth){
              canvas.width=320;canvas.height=140;
              canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
              status.textContent='В очереди пока нет подходящего примера';
              return;
            }
            const img=sample.image,s=cropStates[kind].rect;
            const iw=img.naturalWidth,ih=img.naturalHeight;
            const x=Math.max(0,Math.min(iw-1,Math.round(s.x*iw)));
            const y=Math.max(0,Math.min(ih-1,Math.round(s.y*ih)));
            const right=Math.max(x+1,Math.min(iw,Math.round((s.x+s.w)*iw)));
            const bottom=Math.max(y+1,Math.min(ih,Math.round((s.y+s.h)*ih)));
            const w=right-x,h=bottom-y;
            const factor=Math.min(360/w,180/h,1);
            canvas.width=Math.max(1,Math.round(w*factor));
            canvas.height=Math.max(1,Math.round(h*factor));
            const ctx=canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.imageSmoothingQuality='high';
            ctx.drawImage(img,x,y,w,h,0,0,canvas.width,canvas.height);
            status.textContent=w+' × '+h+' px · пример: '+sample.file.name;
          }

          function scheduleCropPreviews(){
            if(cropPreviewFrame)return;
            cropPreviewFrame=requestAnimationFrame(()=>{
              cropPreviewFrame=0;
              drawCropPreview('landscape');
              drawCropPreview('portrait');
            });
          }

          function switchCropOrientation(kind){
            if(kind!=='landscape'&&kind!=='portrait')return;
            cropOrientation=kind;
            selection={...cropStates[kind].rect};
            cropRatio=cropStates[kind].ratio;
            $$('#psCropOrientationTabs button').forEach(b=>{
              const active=b.dataset.orient===kind;
              b.classList.toggle('active',active);
              b.setAttribute('aria-pressed',String(active));
            });
            $$('#cropRatios button').forEach(b=>
              b.classList.toggle('active',b.dataset.ratio===cropRatio));
            $$('.ps-crop-preview-card').forEach(b=>
              b.classList.toggle('is-active',b.dataset.previewOrient===kind));
            const sample=cropSamples[kind];
            if(sample){
              previewCropFile(sample.file);
            }else{
              if(cropImg.dataset.objectUrl){
                URL.revokeObjectURL(cropImg.dataset.objectUrl);
                delete cropImg.dataset.objectUrl;
              }
              cropImg.removeAttribute('src');
              cropImg.style.display='none';
              cropArea.classList.remove('has-crop-photo');
              applyCrop();
            }
            scheduleCropPreviews();
          }

          $$('#psCropOrientationTabs button').forEach(b=>
            b.addEventListener('click',()=>switchCropOrientation(b.dataset.orient)));

          function inspectCropPhoto(file){
            return new Promise(resolve=>{
              const url=URL.createObjectURL(file),img=new Image();
              img.onload=()=>{
                const kind=img.naturalHeight>img.naturalWidth?'portrait':'landscape';
                resolve({file,image:img,url,kind});
              };
              img.onerror=()=>{
                URL.revokeObjectURL(url);
                resolve(null);
              };
              img.src=url;
            });
          }

          function releaseCropSamples(samples){
            for(const kind of ['landscape','portrait']){
              if(samples[kind])URL.revokeObjectURL(samples[kind].url);
            }
          }

          async function refreshCropSamples(){
            const version=++cropScanVersion;
            const next={landscape:null,portrait:null};
            for(const file of [...selected.crop]){
              if(version!==cropScanVersion){
                releaseCropSamples(next);
                return;
              }
              if(next.landscape && next.portrait)break;
              const sample=await inspectCropPhoto(file);
              if(!sample)continue;
              if(next[sample.kind]){
                URL.revokeObjectURL(sample.url);
              }else{
                next[sample.kind]=sample;
              }
            }
            if(version!==cropScanVersion){
              releaseCropSamples(next);
              return;
            }
            cropImg.removeAttribute('src');
            releaseCropSamples(cropSamples);
            cropSamples=next;
            if(!next[cropOrientation]&&next[cropOrientation==='landscape'?'portrait':'landscape']){
              cropOrientation=cropOrientation==='landscape'?'portrait':'landscape';
            }
            switchCropOrientation(cropOrientation);
          }

          function resetCropOrientations(){
            ++cropScanVersion;
            cropImg.removeAttribute('src');
            releaseCropSamples(cropSamples);
            cropSamples={landscape:null,portrait:null};
            for(const kind of ['landscape','portrait']){
              cropStates[kind]={rect:{x:0,y:0,w:1,h:1},ratio:'free'};
            }
            switchCropOrientation('landscape');
          }

          window.PhotoStudioCropRects={
            landscape:{...cropStates.landscape.rect},
            portrait:{...cropStates.portrait.rect}
          };
          window.PhotoStudioCropRatios={landscape:'free',portrait:'free'};
          """
          html = one(html, anchor, anchor+'\n'+addition, 'Two crop templates')

          html = one(
              html,
              '    window.PhotoStudioCropSelection={...selection};window.dispatchEvent(new CustomEvent('
              "'pscropchange',{detail:{...selection}}));",
              '    window.PhotoStudioCropSelection={...selection};'
              'publishCropStates();scheduleCropPreviews();'
              "window.dispatchEvent(new CustomEvent('pscropchange',{detail:{...selection}}));",
              'Publish both crop rectangles'
          )

          html = one(
              html,
              "    if(!cropImg.naturalWidth||selected.crop.length===files.length)previewCropFile(selected.crop[0]);",
              '    refreshCropSamples();',
              'Find portrait and landscape examples'
          )

          html = one(
              html,
              '    cropImg.onload=()=>{cropArea.classList.add('
              "'has-crop-photo');chooseRatio(cropRatio)};",
              "    cropImg.onload=()=>{cropArea.classList.add('has-crop-photo');applyCrop()};",
              'Preserve each selected rectangle when changing examples'
          )

          html = one(
              html,
              "cropRatio='free';selection={x:0,y:0,w:1,h:1};chooseRatio('free');updateCropBatch();",
              "cropRatio='free';selection={x:0,y:0,w:1,h:1};chooseRatio('free');"
              "resetCropOrientations();updateCropBatch();",
              'Reset orientation previews after saving or clearing'
          )

          html = html.replace(
              "' фотографий · рамка применяется ко всем'",
              "' фотографий · отдельная рамка для горизонтальных и вертикальных'"
          )

          runtime = one(
              runtime,
              "return create('crop',['crop'],{ratio:active?.dataset.ratio||'1:1',zoom:Number($('#cropZoom').value),cropRect:{...window.PhotoStudioCropSelection}})",
              "return create('crop',['crop'],{ratio:'free',"
              "cropRect:{...window.PhotoStudioCropSelection},"
              "cropRects:window.PhotoStudioCropRects,"
              "cropRatios:window.PhotoStudioCropRatios})",
              'Send both crop rectangles to backend'
          )

          app = one(
              app,
              "                                selection = request.get('cropRect')\n"
              "                                w, h = img.size",
              "                                w, h = img.size\n"
              "                                selection = request.get('cropRect')\n"
              "                                orientations = request.get('cropRects')\n"
              "                                if isinstance(orientations, dict):\n"
              "                                    orient = 'portrait' if h > w else 'landscape'\n"
              "                                    selection = orientations.get(orient, selection)\n"
              "                                    orientation_ratios = request.get('cropRatios')\n"
              "                                    if isinstance(orientation_ratios, dict):\n"
              "                                        ratio = str(orientation_ratios.get(orient, 'free'))\n"
              "                                    else:\n"
              "                                        ratio = 'free'",
              'Select crop based on actual photo orientation'
          )

          for path,content in [
              (html_file,html),(runtime_file,runtime),(app_file,app)
          ]:
              path.write_text(
                  '\n'.join(line.rstrip() for line in content.splitlines())+'\n',
                  encoding='utf-8'
              )

          assert 'window.PhotoStudioCropRects' in html
          assert 'window.PhotoStudioCropRatios' in html
          assert 'id="psCropPreviewPanel"' in html
          assert "orient = 'portrait' if h > w else 'landscape'" in app
          assert 'cropRects:window.PhotoStudioCropRects' in runtime
          assert html.count('@keyframes') >= 35
          assert 'const effects=[' in html
          print('Dual orientation crop and previews added without changing other tools.')
          PY

      - name: Add tests for portrait and landscape
        shell: bash
        run: |
          cat > PhotoStudio/tests/test_crop_orientations.py <<'PYTEST'
          import io
          import time
          import unittest
          import tempfile
          from pathlib import Path
          from PIL import Image
          import app

          class CropOrientationTests(unittest.TestCase):
              def test_two_separate_rectangles_and_preserved_originals(self):
                  with tempfile.TemporaryDirectory() as temp:
                      root=Path(temp)
                      studio=app.Studio(root/'results')
                      uploads=[]
                      for name,size in [
                          ('horizontal.png',(200,100)),
                          ('vertical.png',(100,200)),
                      ]:
                          stream=io.BytesIO()
                          Image.new('RGB',size,'#3388cc').save(stream,'PNG')
                          raw=stream.getvalue()
                          uploads.append(studio.add_upload(
                              io.BytesIO(raw),len(raw),name
                          )['id'])
                      job=studio.create_job({
                          'kind':'crop',
                          'files':uploads,
                          'ratio':'free',
                          'cropRects':{
                              'landscape':{'x':0,'y':0,'w':1,'h':.5},
                              'portrait':{'x':0,'y':0,'w':.5,'h':1}
                          },
                          'cropRatios':{
                              'landscape':'free',
                              'portrait':'free'
                          }
                      })
                      for _ in range(200):
                          snap=studio.jobs[job['id']].snapshot()
                          if snap['status'] not in ('queued','running'):
                              break
                          time.sleep(.05)
                      self.assertEqual(snap['status'],'done',snap)
                      output=Path(snap['output'])
                      with Image.open(output/'horizontal.png') as image:
                          self.assertEqual(image.size,(200,50))
                      with Image.open(output/'vertical.png') as image:
                          self.assertEqual(image.size,(50,200))
                      self.assertEqual(snap['done'],2)

              def test_orientation_gui_is_present(self):
                  html=(Path(app.__file__).parent/'web/index.html').read_text(encoding='utf-8')
                  runtime=(Path(app.__file__).parent/'web/runtime.js').read_text(encoding='utf-8')
                  self.assertIn('psCropOrientationTabs',html)
                  self.assertIn('psCropPreviewLandscape',html)
                  self.assertIn('psCropPreviewPortrait',html)
                  self.assertIn('cropRects:window.PhotoStudioCropRects',runtime)

          if __name__=='__main__':
              unittest.main()
          PYTEST

      - name: Validate code and both orientations
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python -m py_compile PhotoStudio/app.py
          node --check PhotoStudio/web/runtime.js
          PYTHONUTF8=1 PYTHONPATH=PhotoStudio python -m unittest discover -s PhotoStudio/tests -p test_crop_orientations.py -v
          git diff --check

      - name: Save full corrected files
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStudio-Dual-Crop-Source
          path: |
            PhotoStudio/app.py
            PhotoStudio/web/index.html
            PhotoStudio/web/runtime.js
            PhotoStudio/tests/test_crop_orientations.py
          retention-days: 14

      - name: Commit tested crop changes
        shell: bash
        run: |
          git config user.name "Photo Studio Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PhotoStudio/app.py PhotoStudio/web/index.html
          git add PhotoStudio/web/runtime.js PhotoStudio/tests/test_crop_orientations.py
          if ! git diff --cached --quiet; then
            git commit -m "Add independent landscape portrait crop and live previews"
            git push origin HEAD:main
          fi

      - name: Start native Windows and Mac builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run native-release.yml --ref main
          echo "Requested new macOS and Windows applications."
  