
name: Photo Studio 8 - Publish Verified Repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/quality-repair.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Verify and save repaired application
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout current project
        uses: actions/checkout@v4

      - name: Download tested repair files
        uses: actions/download-artifact@v4
        with:
          name: PhotoStudio-Quality-Repair-Candidate
          run-id: 39843336509
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Keep workflow files unchanged
        shell: bash
        run: |
          git restore -- .github/workflows/native-release.yml
          test -s PhotoStudio/tests/test_quality_resilience.py
          test -s PhotoStudio/engine/facy_engine.py
          test -s PhotoStudio/engine/size_limit_compress.py
          test -s PhotoStudio/web/index.html
          test -s PhotoStudio/web/runtime.js
          echo "All repaired source files are present"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install testing dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow pytest beautifulsoup4 playwright

      - name: Validate and run regression tests
        shell: bash
        run: |
          python -m compileall -q PhotoStudio
          node --check PhotoStudio/web/runtime.js
          git diff --check
          cd PhotoStudio
          python -m pytest tests -q -k 'not test_browser_queue_and_folder'

      - name: Upload verified corrected files
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStudio-Quality-Repair-Verified
          path: |
            PhotoStudio/app.py
            PhotoStudio/engine/facy_engine.py
            PhotoStudio/engine/size_limit_compress.py
            PhotoStudio/tests/test_quality_resilience.py
            PhotoStudio/web/index.html
            PhotoStudio/web/runtime.js
          if-no-files-found: error
          retention-days: 14

      - name: Create separate repair branch
        shell: bash
        run: |
          git config user.name "Photo Studio QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="fix/photostudio-quality-${{ github.run_id }}"
          git switch -c "$BRANCH"

          git add PhotoStudio/app.py
          git add PhotoStudio/engine/facy_engine.py
          git add PhotoStudio/engine/size_limit_compress.py
          git add PhotoStudio/tests/test_quality_resilience.py
          git add PhotoStudio/web/index.html
          git add PhotoStudio/web/runtime.js

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No source changes found"
            exit 1
          fi

          git commit -m "Photo Studio UI and resilience repairs"
          git push --set-upstream origin "$BRANCH"

          echo "Repair branch: $BRANCH"
