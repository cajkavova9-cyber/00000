name: Photo Studio 8 - Quality Repair (Tested Workflow)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/quality-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Safe repair and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow pytest beautifulsoup4 playwright

      - name: Apply guarded source repairs
        shell: bash
        run: |
          python - <<'PY_REPAIR'
          """Conservative repair of Photo Studio 8 candidate source.

          This file is embedded in one GitHub Actions workflow. Never touch the main branch.
          """
          from pathlib import Path

          ROOT = Path('PhotoStudio')


          def edit_once(source: str, old: str, new: str, name: str) -> str:
              amount = source.count(old)
              if amount != 1:
                  raise RuntimeError(f'{name}: expected one occurrence, found {amount}')
              return source.replace(old, new, 1)


          def rewrite(path: Path, f):
              original = path.read_text(encoding='utf-8')
              changed = f(original)
              assert original != changed, f'No changes in {path}'
              path.write_text(changed, encoding='utf-8')
              print('Updated:', path)


          def fix_html(source):
              lines = source.splitlines(keepends=True)
              candidates = [i for i, line in enumerate(lines) if line.startswith('<div class="brand">')]
              if len(candidates) != 1:
                  raise RuntimeError('Cannot find original left sidebar brand')
              del lines[candidates[0]]
              source = ''.join(lines)
              source = edit_once(
                  source, 'RU <span aria-hidden="true">⌄</span></button>',
                  'RU</button>', 'Language arrow',
              )
              source = edit_once(
                  source, '</head>',
                  '<style id="ps-sidebar-tighten">.rail{padding-top:10px!important}</style></head>',
                  'Sidebar vertical spacing',
              )
              return source


          def fix_runtime(source):
              source = edit_once(
                  source,
                  ' let currentJob=null, currentResult=null, authTimer=null, uploadController=null;',
                  ' let currentJob=null, currentResult=null, authTimer=null, uploadController=null;\n'
                  ' let pollFailures=0;', 'Poll recovery state',
              )
              source = edit_once(
                  source,
                  "     const p=await call('/api/jobs/'+id);",
                  "     const p=await call('/api/jobs/'+id);\n     pollFailures=0;",
                  'Poll success',
              )
              source = edit_once(
                  source,
                  "if(['queued','running'].includes(p.status))setTimeout(()=>poll(id,kind),350);",
                  "if(['queued','running'].includes(p.status))setTimeout(()=>poll(id,kind),kind==='face'?1000:500);",
                  'Poll cadence',
              )
              source = edit_once(
                  source,
                  '   }catch(err){setBusy(false);notify(err.message,true)}\n }',
                  '''   }catch(err){
               if(currentJob?.id!==id)return;
               pollFailures++;
               if(pollFailures===1 || pollFailures%15===0)
                 notify(tx('Временно нет связи с приложением. Проверка продолжится автоматически.',
                           'Connection interrupted. Automatically retrying status updates.',
                           'Зв’язок перервано. Перевірка стану продовжиться автоматично.'),true);
               if(kind==='face')setContent('#faceStatus',tx(
                 'Проверяем соединение. Свапы могут продолжать обрабатываться.',
                 'Reconnecting. Face Swap may still be processing.',
                 'Відновлюємо зв’язок. Обробка облич може тривати.'));
               const retryMs=Math.min(15000,1000*Math.pow(2,Math.min(pollFailures,4)));
               setTimeout(()=>poll(id,kind),retryMs);
             }
           }''',
                  'Polling network failures',
              )
              return source


          def fix_engine(source):
              source = edit_once(source, 'GENERATE_TIMEOUT_MS = 300_000',
                                 'GENERATE_TIMEOUT_MS = 900_000', 'Facy generation timeout')
              source = edit_once(source, 'DOWNLOAD_TIMEOUT_SECONDS = 240',
                                 'DOWNLOAD_TIMEOUT_SECONDS = 1200', 'Facy download timeout')
              source = edit_once(source,
                                 'STALL_SECONDS = 180  # protect the worker from stalled browser downloads',
                                 'STALL_SECONDS = 900  # bounded watchdog for abnormally slow downloads',
                                 'Facy download watchdog')

              # The original version treats missing results in a batch as a reason to
              # advance to later batches, permanently leaving holes in the batch queue.
              start = source.index('                        except FacyIncompleteBatch as exc:\n')
              end = source.index('                        except Exception as exc:\n', start)
              old = source[start:end]
              required = ('completed += saved_this_batch',
                          'incomplete_batches.append',
                          'продолжаем следующую пачку')
              if not all(x in old for x in required):
                  raise RuntimeError('Unexpected incomplete batch control-flow')
              replacement = (
                  "                        except FacyIncompleteBatch as exc:\n"
                  "                            completed += saved_this_batch\n"
                  "                            progress('progress', (completed, len(targets)))\n"
                  "                            _status(progress,\n"
                  "                                f'Пачка {batch_idx}: сохранено {saved_this_batch} из {len(batch)}. '\n"
                  "                                'Следующие пачки не запущены, пока не проверены недостающие результаты. '\n"
                  "                                f'Подробности: {exc}')\n"
                  "                            return (completed, len(targets))\n"
              )
              return source[:start] + replacement + source[end:]


          def fix_compress(source):
              return edit_once(source, 'limit = int(max_mb) * 1024 * 1024',
                               'limit = int(max_mb) * 1_000_000',
                               'Strict decimal-megabyte limit')


          def fix_backend(source):
              old = "                        dest = compress_file(upload.path, upload.name, dest_dir, request.get('maxMB', 2))"
              new = (old + '\n'
                  "                        limit_bytes = int(request.get('maxMB', 2)) * 1_000_000\n"
                  "                        if dest.stat().st_size > limit_bytes:\n"
                  "                            dest.unlink(missing_ok=True)\n"
                  "                            raise RuntimeError('Compressed output exceeds the selected limit')")
              return edit_once(source, old, new, 'Strict backend output check')


          def fix_native_workflow(source):
              return edit_once(
                  source,
                  "      - 'PhotoStudio/web/**'",
                  "      - 'PhotoStudio/web/**'\n"
                  "      - 'PhotoStudio/engine/**'\n"
                  "      - 'PhotoStudio/native_main.py'\n"
                  "      - 'packaging/**'",
                  'Native build triggers',
              )


          rewrite(ROOT / 'web/index.html', fix_html)
          rewrite(ROOT / 'web/runtime.js', fix_runtime)
          rewrite(ROOT / 'engine/facy_engine.py', fix_engine)
          rewrite(ROOT / 'engine/size_limit_compress.py', fix_compress)
          rewrite(ROOT / 'app.py', fix_backend)
          rewrite(Path('.github/workflows/native-release.yml'), fix_native_workflow)
          PY_REPAIR
          cat > PhotoStudio/tests/test_quality_resilience.py <<'PY_TEST'
          """Offline regression tests executed after repairs."""
          from pathlib import Path
          import os
          import tempfile
          import threading
          from unittest.mock import patch

          from PIL import Image

          from engine import facy_engine as facy
          from engine.size_limit_compress import compress_file


          def test_compression_limits_decimal_megabytes():
              with tempfile.TemporaryDirectory() as tmp:
                  folder = Path(tmp)
                  src = folder / 'photo.png'
                  image = Image.frombytes('RGB', (1100, 950), os.urandom(1100 * 950 * 3))
                  image.save(src)
                  before = src.stat().st_size
                  for mb in range(1, 6):
                      out = compress_file(src, src.name, folder / str(mb), mb)
                      assert 0 < out.stat().st_size <= mb * 1_000_000
                      with Image.open(out) as im:
                          im.verify()
                      assert src.stat().st_size == before


          class FakeNode:
              def count(self): return 0
              def wait_for(self, **kwargs): return None
              def click(self, **kwargs): return None


          class FakePage:
              url = facy.FACY_URL
              def goto(self, *args, **kwargs): return None
              def locator(self, *args, **kwargs): return FakeNode()
              def get_by_role(self, *args, **kwargs): return FakeNode()
              def get_by_text(self, *args, **kwargs): return FakeNode()
              def wait_for_url(self, *args, **kwargs): return None


          class FakeContext:
              def new_page(self): return FakePage()
              def close(self): pass


          class FakeBrowser:
              def new_context(self, **kwargs): return FakeContext()
              def close(self): pass


          class FakeChromium:
              def launch(self, **kwargs): return FakeBrowser()


          class FakePlaywright:
              chromium = FakeChromium()
              def __enter__(self): return self
              def __exit__(self, *args): return False


          def test_facy_5000_batches_offline():
              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  inputs = root / 'input'
                  inputs.mkdir()
                  source = inputs / 'source.png'
                  source.touch()
                  targets = []
                  for index in range(5000):
                      p = inputs / f'{index:05}.png'
                      p.touch()
                      targets.append(p)
                  attempts = []
                  statuses = []
                  def fake_upload(*args, **kwargs): return None
                  def fake_download(page, expected, staging, stop, *, on_saved, **kwargs):
                      attempts.append(expected)
                      on_saved(expected)
                      return expected
                  with patch.object(facy, '_upload_via_zone', fake_upload), patch.object(facy, '_download_batch', fake_download):
                      done, total = facy.run_facy(source, targets, root / 'results', {'cookies': []},
                          lambda k, v: statuses.append((k, v)) if k == 'progress' else None,
                          threading.Event(), playwright_factory=FakePlaywright)
                  assert (done, total) == (5000, 5000)
                  assert len(attempts) == 250 and set(attempts) == {20}
                  assert statuses[-1][1] == (5000, 5000)


          def test_facy_incomplete_batch_stops_without_skipping():
              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  inputs = root / 'input'
                  inputs.mkdir()
                  source = inputs / 'source.png'
                  source.touch()
                  targets = []
                  for index in range(40):
                      target = inputs / f'{index:05}.png'
                      target.touch()
                      targets.append(target)
                  attempts = []
                  def fake_download(page, expected, staging, stop, *, on_saved, **kwargs):
                      attempts.append(expected)
                      on_saved(19)
                      raise facy.FacyIncompleteBatch('Simulated missing result')
                  with patch.object(facy, '_upload_via_zone', lambda *a, **kw: None), patch.object(facy, '_download_batch', fake_download):
                      done, total = facy.run_facy(source, targets, root / 'results', {'cookies': []},
                          lambda *args: None, threading.Event(), playwright_factory=FakePlaywright)
                  assert (done, total) == (19, 40)
                  assert attempts == [20], 'Incorrectly skipped to a later batch'


          def test_sidebar_and_language_controls():
              from bs4 import BeautifulSoup
              html = (Path(__file__).parents[1] / 'web/index.html').read_text(encoding='utf-8')
              soup = BeautifulSoup(html, 'html.parser')
              assert soup.select_one('.rail .brand') is None
              assert soup.select_one('#psLanguageButton')
              assert soup.select_one('#psLanguageMenu')
              assert 'RU <span aria-hidden="true">⌄</span>' not in html
          PY_TEST

      - name: Check source syntax and regressions
        shell: bash
        run: |
          python -m compileall -q PhotoStudio
          node --check PhotoStudio/web/runtime.js
          git diff --check
          (cd PhotoStudio && python -m pytest tests -q -k 'not test_browser_queue_and_folder')

      - name: Downloadable corrected files
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStudio-Quality-Repair-Candidate
          path: |
            .github/workflows/native-release.yml
            PhotoStudio/app.py
            PhotoStudio/engine/facy_engine.py
            PhotoStudio/engine/size_limit_compress.py
            PhotoStudio/tests/test_quality_resilience.py
            PhotoStudio/web/index.html
            PhotoStudio/web/runtime.js
          if-no-files-found: error
          retention-days: 14

      - name: Save separately for review (never replace main)
        shell: bash
        run: |
          git config user.name 'Photo Studio QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="fix/photostudio-quality-${{ github.run_id }}"
          git switch -c "$BRANCH"
          git add .github/workflows/native-release.yml
          git add PhotoStudio/app.py PhotoStudio/engine/facy_engine.py
          git add PhotoStudio/engine/size_limit_compress.py
          git add PhotoStudio/tests/test_quality_resilience.py
          git add PhotoStudio/web/index.html PhotoStudio/web/runtime.js
          git commit -m 'Prepare Photo Studio UI and resilience repairs'
          git push --set-upstream origin "$BRANCH"
          echo "Saved test candidate to branch $BRANCH"
